version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: ["/app/migrate"]
    environment:
      POSTGRES_DSN: postgres://nexus:nexus@postgres:5432/nexus?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["/app/api"]
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: postgres://nexus:nexus@postgres:5432/nexus?sslmode=disable
      REDIS_ADDR: redis:6379
      EXTERNAL_MODE: mock
      KMS_MODE: mock
      MASTER_KEY_BASE64: dGVzdGtleTEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      JWT_SECRET: dev-jwt-secret
      INTERNAL_TOKEN: dev-internal-token
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["/app/worker"]
    environment:
      APP_ENV: local
      POSTGRES_DSN: postgres://nexus:nexus@postgres:5432/nexus?sslmode=disable
      REDIS_ADDR: redis:6379
      EXTERNAL_MODE: mock
      KMS_MODE: mock
      MASTER_KEY_BASE64: dGVzdGtleTEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
