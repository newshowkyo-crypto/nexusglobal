version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/ledger"
    gen:
      go:
        package: "db"
        out: "internal/ledger/repository/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
