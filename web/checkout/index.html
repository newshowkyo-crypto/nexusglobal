<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusGlobal Checkout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkout-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 480px;
            width: 100%;
            margin: 20px;
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .checkout-header h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .checkout-header p {
            color: #666;
            font-size: 14px;
        }

        .order-summary {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .order-summary h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
        }

        .order-detail {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .order-detail .label {
            color: #666;
            font-size: 14px;
        }

        .order-detail .value {
            color: #1a1a1a;
            font-size: 14px;
            font-weight: 500;
        }

        .order-total {
            border-top: 1px solid #e0e0e0;
            margin-top: 12px;
            padding-top: 12px;
        }

        .order-total .value {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .payment-form {
            margin-top: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .pay-button {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .pay-button:hover {
            background: #4338ca;
        }

        .pay-button:disabled {
            background: #a5a5a5;
            cursor: not-allowed;
        }

        .security-notice {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        .security-notice svg {
            width: 14px;
            height: 14px;
            vertical-align: middle;
            margin-right: 4px;
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
            color: #dc2626;
            font-size: 14px;
            display: none;
        }

        .success-message {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
            color: #16a34a;
            font-size: 14px;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <div class="checkout-header">
            <h1>Complete Your Payment</h1>
            <p>Secure checkout powered by NexusGlobal</p>
        </div>

        <div class="order-summary">
            <h3>Order Summary</h3>
            <div class="order-detail">
                <span class="label">Order ID</span>
                <span class="value" id="order-id">-</span>
            </div>
            <div class="order-detail">
                <span class="label">Merchant</span>
                <span class="value" id="merchant-name">-</span>
            </div>
            <div class="order-detail order-total">
                <span class="label">Total</span>
                <span class="value" id="order-amount">-</span>
            </div>
        </div>

        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>

        <form class="payment-form" id="payment-form">
            <div class="form-group">
                <label for="card-number">Card Number</label>
                <input type="text" id="card-number" placeholder="1234 5678 9012 3456" maxlength="19" required>
            </div>

            <div class="form-group">
                <label for="card-expiry">Expiry Date</label>
                <input type="text" id="card-expiry" placeholder="MM/YY" maxlength="5" required>
            </div>

            <div class="form-group">
                <label for="card-cvv">CVV</label>
                <input type="text" id="card-cvv" placeholder="123" maxlength="4" required>
            </div>

            <button type="submit" class="pay-button" id="pay-button">
                Pay Now
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing your payment...</p>
        </div>

        <div class="security-notice">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clip-rule="evenodd" />
            </svg>
            Your payment information is encrypted and secure
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showError('Invalid checkout link. Please try again.');
            document.getElementById('payment-form').style.display = 'none';
        }

        fetch(`/api/checkout/validate?token=${token}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showError(data.error);
                    document.getElementById('payment-form').style.display = 'none';
                    return;
                }

                document.getElementById('order-id').textContent = data.order_id;
                document.getElementById('merchant-name').textContent = data.merchant_name;
                document.getElementById('order-amount').textContent = `${data.currency} ${data.amount}`;
            })
            .catch(() => {
                showError('Failed to load order details. Please try again.');
            });

        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payButton = document.getElementById('pay-button');
            const loading = document.getElementById('loading');

            payButton.disabled = true;
            payButton.textContent = 'Processing...';
            loading.style.display = 'block';

            const cardNumber = document.getElementById('card-number').value.replace(/\s/g, '');
            const cardExpiry = document.getElementById('card-expiry').value;
            const cardCvv = document.getElementById('card-cvv').value;

            try {
                const response = await fetch('/api/checkout/charge', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: token,
                        card_number: cardNumber,
                        card_expiry: cardExpiry,
                        card_cvv: cardCvv,
                    }),
                });

                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                    payButton.disabled = false;
                    payButton.textContent = 'Pay Now';
                    loading.style.display = 'none';
                    return;
                }

                showSuccess('Payment successful! Thank you for your purchase.');
                document.getElementById('payment-form').style.display = 'none';
                loading.style.display = 'none';

                if (data.redirect_url) {
                    setTimeout(() => {
                        window.location.href = data.redirect_url;
                    }, 2000);
                }
            } catch (err) {
                showError('Payment failed. Please try again.');
                payButton.disabled = false;
                payButton.textContent = 'Pay Now';
                loading.style.display = 'none';
            }
        });

        document.getElementById('card-number').addEventListener('input', (e) => {
            let value = e.target.value.replace(/\s/g, '');
            value = value.replace(/(\d{4})/g, '$1 ').trim();
            e.target.value = value;
        });

        document.getElementById('card-expiry').addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2);
            }
            e.target.value = value;
        });

        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
        }

        function showSuccess(message) {
            const successEl = document.getElementById('success-message');
            successEl.textContent = message;
            successEl.style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
        }
    </script>
</body>
</html>
